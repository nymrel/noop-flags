name: release evidence

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build and attest source distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Exchange OIDC only for GitHub artifact attestation.
      attestations: write # Record provenance for the exact wheel and sdist.
    steps:
      - name: Check out exact source without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up current Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"

      - name: Verify source, tag, and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_TAG" ]; then
            python scripts/verify_package.py --tag "$RELEASE_TAG"
            git fetch --no-tags origin main
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          else
            python scripts/verify_package.py
          fi

      - name: Run release tests
        run: |
          python -m unittest -v
          python noop_flags.py --selftest
          python noop_flags.py noop_flags.py

      - name: Build distributions with a bounded frontend
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          python -m pip install --disable-pip-version-check "build==1.6.0"
          python -m build

      - name: Verify distributions and record digests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t wheels < <(find dist -maxdepth 1 -type f -name '*.whl')
          mapfile -t sdists < <(find dist -maxdepth 1 -type f -name '*.tar.gz')
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          wheel="${wheels[0]}"
          sdist="${sdists[0]}"
          python scripts/verify_package.py --wheel "$wheel" --sdist "$sdist"
          sha256sum "$wheel" "$sdist" > dist/SHA256SUMS

      - name: Attest exact built artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.1.0
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: noop-flags-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7
