name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Prove the analyser
        run: python noop_flags.py --selftest

      - name: Unit tests
        run: python -m unittest -v

      - name: Dogfood — no ignored flags in our own source
        run: python noop_flags.py noop_flags.py

      - name: Machine-readable smoke
        shell: bash
        run: |
          set +e
          python noop_flags.py --json noop_flags.py > noop-flags.json
          code=$?
          set -e
          test "$code" -eq 0
          python -c "import json; json.load(open('noop-flags.json', encoding='utf-8'))"

  package:
    name: package smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Verify release metadata contract
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          source = Path('noop_flags.py').read_text(encoding='utf-8')
          metadata = Path('pyproject.toml').read_text(encoding='utf-8')
          license_text = Path('LICENSE').read_text(encoding='utf-8')

          source_version = re.search(r'^__version__ = "([^"]+)"$', source, re.MULTILINE)
          project_version = re.search(r'^version = "([^"]+)"$', metadata, re.MULTILINE)
          if source_version is None or project_version is None:
              raise SystemExit('version metadata is missing')
          if source_version.group(1) != project_version.group(1):
              raise SystemExit('source and package versions disagree')
          if 'noop-flags = "noop_flags:main"' not in metadata:
              raise SystemExit('console entry point drifted')
          if 'dependencies = []' not in metadata:
              raise SystemExit('runtime dependency-free contract drifted')
          if 'license = { file = "LICENSE" }' not in metadata:
              raise SystemExit('package license reference drifted')
          if not license_text.startswith('MIT License'):
              raise SystemExit('root license no longer matches package metadata')
          if 'requires = ["hatchling>=1.27,<2"]' not in metadata:
              raise SystemExit('build backend compatibility bound drifted')
          PY

      - name: Build distributions
        run: |
          python -m pip install --disable-pip-version-check "build>=1.2,<2"
          python -m build

      - name: Inspect built wheel contract
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path('dist').glob('*.whl'))
          if len(wheels) != 1:
              raise SystemExit(f'expected one wheel, found {len(wheels)}')
          with ZipFile(wheels[0]) as archive:
              names = archive.namelist()
              if 'noop_flags.py' not in names:
                  raise SystemExit('wheel does not contain noop_flags.py')
              metadata_name = next(
                  (name for name in names if name.endswith('.dist-info/METADATA')),
                  None,
              )
              if metadata_name is None:
                  raise SystemExit('wheel metadata is missing')
              metadata = archive.read(metadata_name).decode('utf-8')
          if 'Name: noop-flags' not in metadata:
              raise SystemExit('wheel name drifted')
          if 'Version: 0.1.0' not in metadata:
              raise SystemExit('wheel version drifted')
          if 'Requires-Dist:' in metadata:
              raise SystemExit('wheel unexpectedly declares a runtime dependency')
          PY

      - name: Install built wheel and prove console entry point
        run: |
          python -m pip install --force-reinstall dist/*.whl
          noop-flags --version
          noop-flags --selftest
          noop-flags noop_flags.py
