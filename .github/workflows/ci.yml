name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11.16"
          - os: ubuntu-latest
            python-version: "3.12.14"
          - os: ubuntu-latest
            python-version: "3.13.15"
          - os: ubuntu-latest
            python-version: "3.14.7"
          - os: windows-latest
            python-version: "3.13.15"
          - os: windows-latest
            python-version: "3.14.7"
    steps:
      - name: Check out without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Prove the analyser
        run: python noop_flags.py --selftest

      - name: Unit tests
        run: python -m unittest -v

      - name: Dogfood — no ignored flags in our own source
        run: python noop_flags.py noop_flags.py

      - name: Machine-readable smoke
        shell: bash
        run: |
          set +e
          python noop_flags.py --json noop_flags.py > noop-flags.json
          code=$?
          set -e
          test "$code" -eq 0
          python -c "import json; json.load(open('noop-flags.json', encoding='utf-8'))"

  package:
    name: package boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up current Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"

      - name: Verify source release contract
        run: python scripts/verify_package.py

      - name: Build distributions with a bounded frontend
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          python -m pip install --disable-pip-version-check "build==1.6.0"
          python -m build

      - name: Inspect built distributions
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t wheels < <(find dist -maxdepth 1 -type f -name '*.whl')
          mapfile -t sdists < <(find dist -maxdepth 1 -type f -name '*.tar.gz')
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          wheel="${wheels[0]}"
          sdist="${sdists[0]}"
          python scripts/verify_package.py --wheel "$wheel" --sdist "$sdist"

      - name: Install the wheel and prove its console entry point
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t wheels < <(find dist -maxdepth 1 -type f -name '*.whl')
          test "${#wheels[@]}" -eq 1
          wheel="${wheels[0]}"
          python -m venv .package-venv
          .package-venv/bin/python -m pip install --disable-pip-version-check --no-deps "$wheel"
          .package-venv/bin/noop-flags --version
          .package-venv/bin/noop-flags --selftest
          .package-venv/bin/noop-flags noop_flags.py
