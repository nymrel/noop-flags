name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Prove the analyser
        run: python noop_flags.py --selftest

      - name: Unit tests
        run: python -m unittest -v

      - name: Dogfood — no ignored flags in our own source
        run: python noop_flags.py noop_flags.py
