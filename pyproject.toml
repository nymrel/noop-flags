[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "noop-flags"
version = "0.1.0"
description = "Find the CLI flags your program accepts and never reads."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Nymrel" }]
keywords = ["argparse", "cli", "lint", "static-analysis", "dead-code", "audit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/nymrel/noop-flags"
Source = "https://github.com/nymrel/noop-flags"

[project.scripts]
noop-flags = "noop_flags:main"

[tool.hatch.build.targets.wheel]
include = ["noop_flags.py"]
